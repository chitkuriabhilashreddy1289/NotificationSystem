<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home Page</title>

<link rel="stylesheet" th:href="@{/css/style.css}">

<link
	th:href="@{https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css}"
	rel="stylesheet">
</head>

<body>

	<header class="bg-primary text-white text-center p-3">
		<h1>My Spring Boot customer App</h1>
	</header>

	<nav class="navbar navbar-expand-lg navbar-light bg-light">
		<div class="container">
			<a class="navbar-brand" href="#">MyApp</a>
			<ul class="navbar-nav">
				<li class="nav-item"><a class="nav-link" th:href="@{/}">Home</a></li>
			</ul>
		</div>
	</nav>

	<div class="container mt-4">

		<h2>Customer Form</h2>

		<!-- ✅ INSERT FORM -->
		<form action="/insert" method="post" class="mb-4">

			<div class="row">
				<div class="col">
					<input type="text" name="cusname" class="form-control"
						placeholder="Enter Name" required>
				</div>

				<div class="col">
					<input type="number" name="age" class="form-control"
						placeholder="Enter Age" required>
				</div>

				<div class="col">
					<input type="text" name="phoneno" class="form-control"
						placeholder="Enter Phone Number" required>
				</div>

				<div class="col">
					<button type="submit" class="btn btn-success">Save</button>
				</div>
			</div>

		</form>

		<!-- TABLE -->
		<h2>Customer List</h2>

		<table class="table table-bordered">
			<thead>
				<tr>
					<th>ID</th>
					<th>Name</th>
					<th>Age</th>
					<th>Phone No</th>
					<th>Actions</th>
				</tr>
			</thead>
			<tbody>
				<tr th:each="c : ${customer}">
					<td th:text="${c.id}"></td>
					<td th:text="${c.cusname}"></td>
					<td th:text="${c.age}"></td>
					<td th:text="${c.phoneno}"></td>
					<td><a th:href="@{/edit/{id}(id=${c.id})}"
						class="btn btn-warning btn-sm">Edit</a> <a
						th:href="@{/delete/{id}(id=${c.id})}"
						class="btn btn-danger btn-sm"
						onclick="return confirm('Are you sure?')">Delete</a></td>
				</tr>
			</tbody>
		</table>

	</div>

	<footer class="bg-dark text-white text-center p-2 mt-4">
		<p>&copy; 2026 MyApp</p>
	</footer>

	<script th:src="@{/js/script.js}"></script>
	<script
		th:src="@{https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js}"></script>

</body>
</html>
