<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Edit Customer</title>
<link th:href="@{https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css}" rel="stylesheet">
</head>

<body class="container mt-5">

<h2>Edit Customer</h2>

<form th:action="@{/update}" method="post" th:object="${customerObj}">

    <input type="hidden" th:field="*{id}"/>

    <div class="mb-3">
        <input type="text" th:field="*{cusname}" class="form-control"/>
    </div>

    <div class="mb-3">
        <input type="number" th:field="*{age}" class="form-control"/>
    </div>

    <div class="mb-3">
        <input type="text" th:field="*{phoneno}" class="form-control"/>
    </div>

    <button type="submit" class="btn btn-success">Update</button>

</form>

</body>
</html>
